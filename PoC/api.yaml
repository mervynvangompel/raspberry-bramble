# api.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: default
data:
  DB_HOST: "postgres"
  DB_NAME: "dogfeeding"
  DB_USER: "postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dog-feeding-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dog-feeding-api
  template:
    metadata:
      labels:
        app: dog-feeding-api
    spec:
      containers:
      - name: api
        image: dog-feeding-api:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dog-feeding-api
  namespace: default
spec:
  selector:
    app: dog-feeding-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
